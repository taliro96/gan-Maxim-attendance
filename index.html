<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="נוכחות הגן">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>נוכחות הגן</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

  <section id="loginScreen" class="screen active">
    <div class="login-page">
      <div class="login-brand">
        <img src="logo.png" alt="גן מקסים" class="login-logo">
        <h1>ברוכה הבאה</h1>
        <p>נוכחות צוות הגן</p>
      </div>

      <div class="login-card">
        <div class="login-title">קוד אישי</div>
        <div class="login-help">הכניסי את הקוד האישי שלך</div>

        <div class="pin-visual" id="pinVisual" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <input id="pin"
               class="pin-hidden"
               type="password"
               inputmode="numeric"
               maxlength="4"
               autocomplete="one-time-code"
               aria-label="קוד אישי">

        <div class="langs">
          <button id="he" class="active" onclick="setLang('he')">עברית 🇮🇱</button>
          <button id="ru" onclick="setLang('ru')">Русский 🇷🇺</button>
        </div>

        <button id="loginButton" class="main-btn login-submit" onclick="login()">
          אישור
        </button>

        <div id="loginMsg" class="msg"></div>
      </div>
    </div>
  </section>

  <section id="homeScreen" class="screen">
    <header class="brand">
      <div class="brand-left">
        <img src="logo.png" alt="גן מקסים" class="top-logo">
        <div>
          <div class="brand-name">גן מקסים</div>
          <div id="today" class="brand-date"></div>
        </div>
      </div>
      <button class="menu-btn" aria-label="תפריט">☰</button>
    </header>

    <div class="hero card">
      <h2 id="hello" class="hello"></h2>
      <div id="homeSub" class="sub">הנוכחות שלך להיום</div>

      <div id="status" class="status">
        <div class="status-line">
          <span class="dot"></span>
          <span id="statusText">טוען...</span>
        </div>
        <div id="time" class="time"></div>
      </div>

      <button id="startBtn" class="action start" onclick="startWork()">
        🟢 התחל עבודה
      </button>

      <button id="endBtn" class="action end hidden" onclick="endWork()">
        🔴 סיים עבודה
      </button>
    </div>

    <div class="secondary-grid">
      <button class="tile" onclick="openManual()">
        <div class="tile-icon">✏️</div>
        <div class="tile-title">תיקון שעות</div>
        <div class="tile-sub">דיווח ידני</div>
      </button>

      <button class="tile" onclick="openAbsence()">
        <div class="tile-icon">📅</div>
        <div class="tile-title">חופשה / היעדרות</div>
        <div class="tile-sub">דיווח חדש</div>
      </button>
    </div>

    <button class="logout" onclick="logout()">התנתקות</button>
  </section>

  <section id="historyScreen" class="screen">
    <div class="section-head">
      <button class="back" onclick="show('homeScreen')">→</button>
      <h2>📋 ההיסטוריה שלי</h2>
    </div>

    <div id="summary" class="summary"></div>

    <div class="filters">
      <button class="filter active" data-f="all">הכל</button>
      <button class="filter" data-f="work">🕐 עבודה</button>
      <button class="filter" data-f="sick">🤒 מחלה</button>
      <button class="filter" data-f="vacation">🏖️ חופשה</button>
      <button class="filter" data-f="absence">🚫 היעדרות</button>
    </div>

    <div id="history"></div>
  </section>

</main>

<nav id="nav" class="bottom">
  <button class="nav active" onclick="show('homeScreen')">
    <i>⌂</i>בית
  </button>
  <button class="nav" onclick="showHistory()">
    <i>▣</i>היסטוריה
  </button>
  <button class="nav" onclick="openAbsence()">
    <i>＋</i>דיווח
  </button>
</nav>

<div id="modal" class="modal-wrap hidden"></div>
<div id="toast" class="toast"></div>

<script>
/* ==================================================
   CONFIG
   ================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyVTnp4s8jZL659otT6kp9BuOT5qIVLjyOf9SV5BgHXGWAQ5gchnPoH4wc9zgffTB0B/exec";

const SESSION_KEY = "gan_session_v2";
const LANG_KEY = "gan_lang";

let session = null;
let currentLang = localStorage.getItem(LANG_KEY) || "he";
let allHistory = [];
let requestInProgress = false;


/* ==================================================
   BASIC UI
   ================================================== */

function $(id) {
  return document.getElementById(id);
}

function show(id) {
  document.querySelectorAll(".screen")
    .forEach(x => x.classList.remove("active"));

  const screen = $(id);
  if (screen) screen.classList.add("active");

  document.querySelectorAll(".nav")
    .forEach((x, i) => {
      const active =
        (id === "homeScreen" && i === 0) ||
        (id === "historyScreen" && i === 1);

      x.classList.toggle("active", active);
    });

  window.scrollTo(0, 0);
}

function toast(message) {
  const box = $("toast");
  box.textContent = message;
  box.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    box.classList.remove("show");
  }, 2500);
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);

  document.documentElement.lang = lang;
  document.documentElement.dir = "rtl";

  $("he").classList.toggle("active", lang === "he");
  $("ru").classList.toggle("active", lang === "ru");

  updateToday();
}

function updateToday() {
  $("today").textContent =
    new Intl.DateTimeFormat(
      currentLang === "ru" ? "ru-RU" : "he-IL",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    ).format(new Date());
}


/* ==================================================
   JSONP — מנגנון תקשורת יחיד ופשוט
   ================================================== */

function api(action, params = {}) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "gan_cb_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    const query = new URLSearchParams();
    query.set("action", action);
    query.set("callback", callbackName);
    query.set("_ts", String(Date.now()));

    Object.keys(params).forEach(key => {
      query.set(
        key,
        params[key] == null ? "" : String(params[key])
      );
    });

    let finished = false;

    const cleanup = () => {
      if (finished) return;
      finished = true;

      clearTimeout(timer);

      try {
        delete window[callbackName];
      } catch (_) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(
        new Error("השרת לא הגיב בזמן")
      );
    }, 20000);

    window[callbackName] = data => {
      cleanup();
      resolve(data);
    };

    script.async = true;

    script.onerror = () => {
      cleanup();
      reject(
        new Error("לא ניתן להתחבר לשרת")
      );
    };

    script.src =
      API_URL + "?" + query.toString();

    document.head.appendChild(script);
  });
}


/* ==================================================
   LOGIN
   ================================================== */

async function login() {
  if (requestInProgress) return;

  const pin = $("pin").value.trim();
  const msg = $("loginMsg");
  const button = $("loginButton");

  msg.textContent = "";
  msg.className = "msg";

  if (!/^\d{4}$/.test(pin)) {
    msg.textContent = "יש להזין קוד בן 4 ספרות";
    msg.className = "msg error";
    return;
  }

  requestInProgress = true;
  button.disabled = true;
  button.textContent = "מתחברת...";

  try {
    const result = await api("login", { pin: pin });

    if (!result || !result.success) {
      msg.textContent =
        (result && result.message) || "קוד אישי שגוי";

      msg.className = "msg error";
      return;
    }

    session = result.session;

    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify(session)
    );

    enterHome(result.status);

  } catch (error) {
    msg.textContent = error.message || "שגיאת חיבור";
    msg.className = "msg error";

  } finally {
    requestInProgress = false;
    button.disabled = false;
    button.textContent = "אישור";
  }
}


/* ==================================================
   HOME / STATUS
   ================================================== */

function enterHome(status) {
  $("hello").textContent =
    "שלום, " + session.name + " 👋";

  $("homeSub").textContent =
    "הנוכחות שלך להיום";

  $("nav").classList.add("show");

  updateToday();
  show("homeScreen");

  if (status) {
    applyStatus(status);
  } else {
    loadStatus();
  }
}

function applyStatus(status) {
  if (!status) return;

  $("statusText").textContent =
    status.started
      ? "את כרגע בעבודה"
      : status.ended
        ? "המשמרת האחרונה הסתיימה"
        : "עדיין לא התחלת לעבוד";

  $("time").textContent =
    status.started ? (status.startTime || "") : "";

  $("status").classList.toggle(
    "work",
    !!status.started
  );

  $("startBtn").classList.toggle(
    "hidden",
    !!status.started
  );

  $("endBtn").classList.toggle(
    "hidden",
    !status.started
  );
}

async function loadStatus() {
  try {
    const result = await api("status", {
      token: session.token
    });

    if (!result.success) {
      logout();
      return;
    }

    applyStatus(result);

  } catch (error) {
    toast(error.message);
  }
}


/* ==================================================
   WORK
   ================================================== */

async function startWork() {
  if (requestInProgress) return;

  requestInProgress = true;

  try {
    const result = await api("start", {
      token: session.token
    });

    if (!result.success) {
      toast(result.message);
      return;
    }

    applyStatus({
      success: true,
      started: true,
      ended: false,
      startTime: result.time || ""
    });

    toast("העבודה התחילה ✅");

  } catch (error) {
    toast(error.message);

  } finally {
    requestInProgress = false;
  }
}

async function endWork() {
  if (requestInProgress) return;

  requestInProgress = true;

  try {
    const result = await api("end", {
      token: session.token
    });

    if (!result.success) {
      toast(result.message);
      return;
    }

    applyStatus({
      success: true,
      started: false,
      ended: true,
      startTime: ""
    });

    toast("העבודה הסתיימה ✅");

  } catch (error) {
    toast(error.message);

  } finally {
    requestInProgress = false;
  }
}


/* ==================================================
   LOGOUT
   ================================================== */

function logout() {
  session = null;
  localStorage.removeItem(SESSION_KEY);

  $("nav").classList.remove("show");
  $("pin").value = "";
  syncPinVisual();
  $("loginMsg").textContent = "";

  show("loginScreen");
}


/* ==================================================
   MODALS
   ================================================== */

function openModal(html) {
  $("modal").innerHTML =
    '<div class="modal">' + html + "</div>";

  $("modal").classList.remove("hidden");
}

function closeModal() {
  $("modal").classList.add("hidden");
}


/* ==================================================
   MANUAL HOURS
   ================================================== */

function openManual() {
  openModal(`
    <div class="section-head">
      <button class="back" onclick="closeModal()">→</button>
      <h2>✏️ תיקון שעות</h2>
    </div>

    <div class="label">תאריך</div>
    <input id="md" class="field" type="date">

    <div class="label">שעת התחלה</div>
    <input id="ms" class="field" type="time">

    <div class="label">שעת סיום</div>
    <input id="me" class="field" type="time">

    <button class="main-btn" onclick="saveManual()">
      שמור שעות
    </button>

    <button class="cancel" onclick="closeModal()">
      ביטול
    </button>
  `);
}

async function saveManual() {
  try {
    const result = await api("manual", {
      token: session.token,
      date: $("md").value,
      start: $("ms").value,
      end: $("me").value
    });

    if (!result.success) {
      toast(result.message);
      return;
    }

    closeModal();
    toast("השעות נשמרו ✅");

  } catch (error) {
    toast(error.message);
  }
}


/* ==================================================
   ABSENCE
   ================================================== */

function openAbsence() {
  openModal(`
    <div class="section-head">
      <button class="back" onclick="closeModal()">→</button>
      <h2>📅 חופשה / היעדרות</h2>
    </div>

    <div class="label">סוג דיווח</div>
    <select id="at" class="field">
      <option value="חופשה">🏖️ חופשה</option>
      <option value="מחלה">🤒 מחלה</option>
      <option value="היעדרות">🚫 היעדרות</option>
    </select>

    <div class="label">מתאריך</div>
    <input id="af" class="field" type="date">

    <div class="label">עד תאריך</div>
    <input id="ao" class="field" type="date">

    <div class="label">הערה</div>
    <textarea id="an"
              class="field area"
              placeholder="לא חובה"></textarea>

    <button class="main-btn" onclick="saveAbs()">
      שמור דיווח
    </button>

    <button class="cancel" onclick="closeModal()">
      ביטול
    </button>
  `);
}

async function saveAbs() {
  try {
    const result = await api("absence", {
      token: session.token,
      type: $("at").value,
      from: $("af").value,
      to: $("ao").value,
      note: $("an").value
    });

    if (!result.success) {
      toast(result.message);
      return;
    }

    closeModal();
    toast("הדיווח נשמר ✅");

  } catch (error) {
    toast(error.message);
  }
}


/* ==================================================
   HISTORY
   ================================================== */

async function showHistory() {
  show("historyScreen");

  $("history").textContent = "טוען...";

  try {
    const result = await api("history", {
      token: session.token
    });

    if (!result.success) {
      toast(result.message);
      return;
    }

    allHistory = result.history || [];
    renderHistory("all");

  } catch (error) {
    toast(error.message);
  }
}

document.querySelectorAll(".filter").forEach(button => {
  button.onclick = function() {
    document
      .querySelectorAll(".filter")
      .forEach(x => x.classList.remove("active"));

    button.classList.add("active");
    renderHistory(button.dataset.f);
  };
});

function renderHistory(filter) {
  const history = allHistory.filter(item => {
    if (filter === "all") return true;

    if (filter === "work") {
      return item.source === "attendance";
    }

    if (filter === "sick") {
      return item.absenceType === "מחלה";
    }

    if (filter === "vacation") {
      return item.absenceType === "חופשה";
    }

    if (filter === "absence") {
      return item.absenceType === "היעדרות";
    }

    return true;
  });

  let minutes = 0;
  let work = 0;
  let sick = 0;
  let vacation = 0;
  let absence = 0;

  allHistory.forEach(item => {
    if (item.source === "attendance") {
      work++;

      if (item.start && item.end) {
        const a = item.start.split(":").map(Number);
        const b = item.end.split(":").map(Number);

        minutes += Math.max(
          0,
          b[0] * 60 + b[1] -
          a[0] * 60 - a[1]
        );
      }

    } else if (item.absenceType === "מחלה") {
      sick++;

    } else if (item.absenceType === "חופשה") {
      vacation++;

    } else {
      absence++;
    }
  });

  $("summary").innerHTML = `
    <div class="summary-grid">
      <div>
        <div class="sum-label">שעות עבודה</div>
        <div class="sum-value">
          ${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}
        </div>
      </div>

      <div>
        <div class="sum-label">דיווחי עבודה</div>
        <div class="sum-value">${work}</div>
      </div>

      <div>
        <div class="sum-label">חופשה</div>
        <div class="sum-value">${vacation}</div>
      </div>

      <div>
        <div class="sum-label">מחלה / היעדרות</div>
        <div class="sum-value">${sick + absence}</div>
      </div>
    </div>
  `;

  if (!history.length) {
    $("history").innerHTML =
      '<div style="text-align:center;color:var(--muted);padding:40px">אין דיווחים להצגה</div>';
    return;
  }

  $("history").innerHTML = history.map(item => {

    if (item.source === "attendance") {
      return `
        <article class="row">
          <div class="row-top">
            <div class="date">
              ${formatDate(item.date)}
            </div>
            <div class="type">🕐 עבודה</div>
          </div>

          <div class="times">
            ${item.start || "--:--"}
            →
            ${item.end || "--:--"}
            <span class="total">${item.total || ""}</span>
          </div>

          ${
            item.note
              ? `<div class="note">💬 ${escapeHtml(item.note)}</div>`
              : ""
          }
        </article>
      `;
    }

    const icon =
      item.absenceType === "מחלה"
        ? "🤒"
        : item.absenceType === "חופשה"
          ? "🏖️"
          : "🚫";

    return `
      <article class="row">
        <div class="row-top">
          <div class="date">
            ${formatDate(item.absenceFrom)}
          </div>

          <div class="type">
            ${icon} ${escapeHtml(item.absenceType)}
          </div>
        </div>

        <div class="times">
          ${formatDate(item.absenceFrom)}
          →
          ${formatDate(item.absenceTo)}
        </div>

        ${
          item.note
            ? `<div class="note">💬 ${escapeHtml(item.note)}</div>`
            : ""
        }
      </article>
    `;
  }).join("");
}

function formatDate(value) {
  if (!value) return "";

  return String(value)
    .split("-")
    .reverse()
    .join("/");
}

function escapeHtml(value) {
  return String(value || "").replace(
    /[&<>"']/g,
    function(char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    }
  );
}


/* ==================================================
   PIN VISUAL
   ================================================== */

const pinInput = $("pin");
const pinBoxes =
  [...document.querySelectorAll("#pinVisual span")];

function syncPinVisual() {
  const value = pinInput.value || "";

  pinBoxes.forEach((box, index) => {
    box.textContent = value[index] ? "•" : "";
    box.classList.toggle(
      "filled",
      !!value[index]
    );
  });
}

pinInput.addEventListener(
  "input",
  syncPinVisual
);

pinInput.addEventListener(
  "focus",
  () => $("pinVisual").classList.add("focused")
);

pinInput.addEventListener(
  "blur",
  () => $("pinVisual").classList.remove("focused")
);

$("pinVisual").addEventListener(
  "click",
  () => pinInput.focus()
);


/* ==================================================
   STARTUP
   ================================================== */

function restoreSession() {
  try {
    const raw =
      localStorage.getItem(SESSION_KEY);

    if (!raw) return false;

    session = JSON.parse(raw);

    if (!session || !session.token) {
      session = null;
      return false;
    }

    enterHome();
    return true;

  } catch (_) {
    session = null;
    localStorage.removeItem(SESSION_KEY);
    return false;
  }
}

setLang(currentLang);
restoreSession();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker
    .register("./sw.js?v=7", { updateViaCache: "none" })
    .then(registration => {
      registration.update().catch(() => {});
    })
    .catch(() => {});
}
</script>

</body>
</html>
