<title>נוכחות הגן</title>
<style>

:root{
  --bg:#f7faf8;
  --card:#ffffff;
  --ink:#34424a;
  --muted:#7d898e;
  --line:#e4ebe7;
  --green:#91b9a2;
  --green-dark:#6f9780;
  --green-soft:#edf6f0;
  --pink:#e8aebc;
  --pink-soft:#fbf0f3;
  --blue:#b9d9e8;
  --blue-soft:#eff7fa;
  --cream:#fffaf3;
  --shadow:0 12px 32px rgba(66,83,76,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:
    radial-gradient(circle at 0 0,rgba(185,217,232,.30),transparent 30%),
    radial-gradient(circle at 100% 12%,rgba(232,174,188,.20),transparent 27%),
    linear-gradient(180deg,#f9fbfa 0%,#f3f7f5 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
.app{max-width:520px;min-height:100vh;margin:auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 16px}
.brand-name{font-weight:800;font-size:18px}
.brand-date{font-size:12px;color:var(--muted);margin-top:3px}
.avatar{width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.login{margin-top:5vh;padding:26px 20px;text-align:center}

.langs{display:flex;gap:8px;margin-bottom:12px}
.langs button{flex:1;padding:11px;border-radius:13px;background:#f2f5f3;color:#65716d;border:1px solid var(--line)}
.langs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.pin{width:100%;padding:15px;border:1px solid #dce6e1;border-radius:15px;text-align:center;letter-spacing:7px;font-size:23px;outline:none;background:#fbfdfc}
.pin:focus,.field:focus{border-color:#9ebfac;box-shadow:0 0 0 4px rgba(145,185,162,.14)}
.main-btn{width:100%;padding:16px;border-radius:17px;background:var(--green);color:#fff;font-weight:800;margin-top:12px;box-shadow:0 7px 18px rgba(111,151,128,.16)}
.msg{min-height:22px;margin-top:10px;font-size:14px}.error{color:#b85f6d}.success{color:#5d8c70}
.hero{padding:20px;margin-bottom:12px}
.hello{font-size:24px;font-weight:800;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}
.status{margin-top:18px;padding:17px;border-radius:20px;background:var(--blue-soft);border:1px solid #dcecf2}
.status.work{background:var(--green-soft);border-color:#d5e9dc}
.status-line{font-size:14px;color:#65716d}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#aeb7b2;margin-left:7px}.work .dot{background:var(--green-dark)}
.time{font-size:30px;font-weight:800;margin-top:6px;direction:ltr;text-align:right}
.action{width:100%;padding:18px;border-radius:18px;color:#fff;font-weight:800;font-size:19px;margin-top:12px}
.start{background:var(--green)}.end{background:var(--pink)}
.secondary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{padding:16px 13px;text-align:right;background:#fff;border:1px solid var(--line);border-radius:18px;min-height:78px}
.tile-icon{font-size:20px}.tile-title{font-weight:800;font-size:14px;margin-top:4px}.tile-sub{font-size:12px;color:var(--muted);margin-top:2px}
.logout{width:100%;background:transparent;color:#8b9691;padding:15px}
.section-head{display:flex;align-items:center;gap:10px;margin:4px 0 16px}.back{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line)}.section-head h2{font-size:21px;margin:0}
.summary{padding:17px;background:var(--green-soft);border:1px solid #dcebe1;border-radius:20px;margin-bottom:12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sum-label{font-size:12px;color:var(--muted)}.sum-value{font-size:20px;font-weight:800;margin-top:2px}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px;padding-bottom:2px}
.filter{white-space:nowrap;padding:10px 13px;border-radius:13px;background:#eef2f0;color:#606d68}.filter.active{background:var(--green);color:#fff}
.row{padding:15px;border-radius:18px;background:#fff;border:1px solid var(--line);margin-bottom:9px}.row-top{display:grid;grid-template-columns:1fr 1fr;gap:7px}.date{font-weight:800}.type{color:#66726e;font-size:13px}.times{margin-top:8px;font-size:15px;direction:ltr;text-align:right}.total{font-weight:800}.note{margin-top:9px;padding-top:8px;border-top:1px solid #edf1ef;color:#7a8581;font-size:12px}
.modal-wrap{position:fixed;inset:0;background:rgba(42,52,48,.30);backdrop-filter:blur(5px);display:flex;align-items:flex-end;z-index:20}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 17px calc(24px + env(safe-area-inset-bottom))}
.label{font-size:13px;color:var(--muted);margin:13px 2px 6px}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;outline:none;background:#fff}.area{min-height:90px;resize:vertical}.cancel{width:100%;padding:14px;border-radius:14px;background:#f1f3f2;margin-top:8px;color:#5e6965}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:none;gap:8px}
.bottom.show{display:flex}.nav{flex:1;background:transparent;color:#7c8782;border-radius:14px;padding:8px 4px;font-size:12px}.nav.active{background:var(--pink-soft);color:#b86d7b;font-weight:800}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;width:min(430px,calc(100% - 28px));background:#405049;color:#fff;padding:14px 16px;border-radius:16px;text-align:center;font-weight:700}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(max-width:420px){.app{padding:12px 12px 28px}.card{border-radius:23px}.logo{width:150px;height:100px}.login{margin-top:3vh;padding:23px 17px}}

</style>
</head>
<body>
<main class="app">
  <section id="loginScreen" class="screen active">
    <div class="login card">
      <div class="logo">🌸</div>
      <h1>נוכחות צוות הגן</h1>
      <p id="loginSub">הכניסי את הקוד האישי שלך</p>
      <div class="langs"><button id="he" class="active" onclick="lang('he')">עברית 🇮🇱</button><button id="ru" onclick="lang('ru')">Русский 🇷🇺</button></div>
      <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="8" placeholder="קוד אישי">
      <button class="main-btn" onclick="login()">כניסה</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </section>

  <section id="homeScreen" class="screen">
    <header class="brand"><div><div class="brand-name">נוכחות צוות הגן</div><div id="today" class="brand-date"></div></div><div class="avatar">👤</div></header>
    <div class="hero card">
      <h2 id="hello" class="hello"></h2><div id="homeSub" class="sub"></div>
      <div id="status" class="status"><div class="status-line"><span class="dot"></span><span id="statusText">טוען...</span></div><div id="time" class="time"></div></div>
      <button id="startBtn" class="action start" onclick="startWork()">🟢 התחל עבודה</button>
      <button id="endBtn" class="action end hidden" onclick="endWork()">🔴 סיים עבודה</button>
    </div>
    <div class="secondary-grid">
      <button class="tile" onclick="openManual()"><div class="tile-icon">✏️</div><div class="tile-title">תיקון שעות</div><div class="tile-sub">דיווח ידני</div></button>
      <button class="tile" onclick="openAbsence()"><div class="tile-icon">📅</div><div class="tile-title">חופשה / היעדרות</div><div class="tile-sub">דיווח חדש</div></button>
    </div>
    <button class="logout" onclick="logout()">התנתקות</button>
  </section>

  <section id="historyScreen" class="screen">
    <div class="section-head"><button class="back" onclick="show('homeScreen')">→</button><h2>📋 ההיסטוריה שלי</h2></div>
    <div id="summary" class="summary"></div>
    <div class="filters"><button class="filter active" data-f="all">הכל</button><button class="filter" data-f="work">🕐 עבודה</button><button class="filter" data-f="sick">🤒 מחלה</button><button class="filter" data-f="vacation">🏖️ חופשה</button><button class="filter" data-f="absence">🚫 היעדרות</button></div>
    <div id="history"></div>
  </section>
</main>

<nav id="nav" class="bottom">
  <button class="nav active" onclick="show('homeScreen')"><i>⌂</i>בית</button>
  <button class="nav" onclick="showHistory()"><i>▣</i>היסטוריה</button>
  <button class="nav" onclick="openAbsence()"><i>＋</i>דיווח</button>
</nav>

<div id="modal" class="modal-wrap hidden"></div><div id="toast" class="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxxw9oLXorL9GT4OqK-1gwedpUDzsY6kOx3kOZD1JSyccynAfcYWk2v4jmrUmYhu_xL/exec";
let session=JSON.parse(localStorage.getItem("gan_session")||"null"), currentLang=localStorage.getItem("gan_lang")||"he", allHistory=[];

function lang(x){currentLang=x;localStorage.setItem("gan_lang",x);document.documentElement.lang=x;document.documentElement.dir="rtl";document.getElementById("he").classList.toggle("active",x==="he");document.getElementById("ru").classList.toggle("active",x==="ru");}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav").forEach((x,i)=>x.classList.toggle("active",(id==="homeScreen"&&i===0)||(id==="historyScreen"&&i===1)));window.scrollTo(0,0)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove("show"),2500)}
function today(){document.getElementById("today").textContent=new Intl.DateTimeFormat(currentLang==="ru"?"ru-RU":"he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date())}
function jsonp(action,params={}){
  return new Promise((resolve,reject)=>{
    if(API_URL.includes("PASTE_")) return reject(new Error("יש להגדיר את כתובת ה-Apps Script"));
    const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2), s=document.createElement("script");
    const q=new URLSearchParams({action,callback:cb,...params}); s.src=API_URL+"?"+q.toString();
    window[cb]=data=>{delete window[cb];s.remove();resolve(data)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error("לא ניתן להתחבר לשרת"))};
    document.body.appendChild(s);
    setTimeout(()=>{if(window[cb]){delete window[cb];s.remove();reject(new Error("החיבור ארך זמן רב מדי"))}},15000);
  });
}
async function login(){
  const pin=document.getElementById("pin").value.trim(), msg=document.getElementById("loginMsg");msg.textContent="";
  try{const r=await jsonp("login",{pin});if(!r.success){msg.textContent=r.message||"קוד אישי שגוי";msg.className="msg error";return}
    session=r.session;localStorage.setItem("gan_session",JSON.stringify(session));enterHome();
  }catch(e){msg.textContent=e.message;msg.className="msg error"}
}
function enterHome(){document.getElementById("hello").textContent=`שלום, ${session.name} 👋`;document.getElementById("homeSub").textContent="הנוכחות שלך להיום";document.getElementById("nav").classList.add("show");today();show("homeScreen");loadStatus()}
async function loadStatus(){try{const r=await jsonp("status",{token:session.token});if(!r.success){logout();return}document.getElementById("statusText").textContent=r.started?"את כרגע בעבודה":r.ended?"המשמרת האחרונה הסתיימה":"עדיין לא התחלת לעבוד";document.getElementById("time").textContent=r.started?(r.startTime||""):"";document.getElementById("status").classList.toggle("work",!!r.started);document.getElementById("startBtn").classList.toggle("hidden",!!r.started);document.getElementById("endBtn").classList.toggle("hidden",!r.started)}catch(e){toast(e.message)}}
async function startWork(){try{const r=await jsonp("start",{token:session.token});if(!r.success){toast(r.message);return}toast("העבודה התחילה ✅");loadStatus()}catch(e){toast(e.message)}}
async function endWork(){try{const r=await jsonp("end",{token:session.token});if(!r.success){toast(r.message);return}toast("העבודה הסתיימה ✅");loadStatus()}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem("gan_session");session=null;document.getElementById("nav").classList.remove("show");show("loginScreen")}
function openModal(inner){document.getElementById("modal").innerHTML=`<div class="modal">${inner}</div>`;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function openManual(){openModal(`<div class="section-head"><button class="back" onclick="closeModal()">→</button><h2>✏️ תיקון שעות</h2></div><div class="label">תאריך</div><input id="md" class="field" type="date"><div class="label">שעת התחלה</div><input id="ms" class="field" type="time"><div class="label">שעת סיום</div><input id="me" class="field" type="time"><button class="main-btn" onclick="saveManual()">שמור שעות</button><button class="cancel" onclick="closeModal()">ביטול</button>`)}
async function saveManual(){try{const r=await jsonp("manual",{token:session.token,date:md.value,start:ms.value,end:me.value});if(!r.success){toast(r.message);return}closeModal();toast("השעות נשמרו ✅")}catch(e){toast(e.message)}}
function openAbsence(){openModal(`<div class="section-head"><button class="back" onclick="closeModal()">→</button><h2>📅 חופשה / היעדרות</h2></div><div class="label">סוג דיווח</div><select id="at" class="field"><option value="חופשה">🏖️ חופשה</option><option value="מחלה">🤒 מחלה</option><option value="היעדרות">🚫 היעדרות</option></select><div class="label">מתאריך</div><input id="af" class="field" type="date"><div class="label">עד תאריך</div><input id="ao" class="field" type="date"><div class="label">הערה</div><textarea id="an" class="field area" placeholder="לא חובה"></textarea><button class="main-btn" onclick="saveAbs()">שמור דיווח</button><button class="cancel" onclick="closeModal()">ביטול</button>`)}
async function saveAbs(){try{const r=await jsonp("absence",{token:session.token,type:at.value,from:af.value,to:ao.value,note:an.value});if(!r.success){toast(r.message);return}closeModal();toast("הדיווח נשמר ✅")}catch(e){toast(e.message)}}
async function showHistory(){show("historyScreen");document.getElementById("history").textContent="טוען...";try{const r=await jsonp("history",{token:session.token});if(!r.success){toast(r.message);return}allHistory=r.history||[];renderHistory("all")}catch(e){toast(e.message)}}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderHistory(b.dataset.f)})
function renderHistory(filter){let h=allHistory.filter(x=>filter==="all"||(filter==="work"&&x.source==="attendance")||(filter==="sick"&&x.absenceType==="מחלה")||(filter==="vacation"&&x.absenceType==="חופשה")||(filter==="absence"&&x.absenceType==="היעדרות"));let mins=0,w=0,s=0,v=0,a=0;allHistory.forEach(x=>{if(x.source==="attendance"){w++;if(x.start&&x.end){let [sh,sm]=x.start.split(":").map(Number),[eh,em]=x.end.split(":").map(Number);mins+=Math.max(0,eh*60+em-sh*60-sm)}}else if(x.absenceType==="מחלה")s++;else if(x.absenceType==="חופשה")v++;else a++});document.getElementById("summary").innerHTML=`<div class="summary-grid"><div><div class="sum-label">שעות עבודה</div><div class="sum-value">${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}</div></div><div><div class="sum-label">דיווחי עבודה</div><div class="sum-value">${w}</div></div><div><div class="sum-label">חופשה</div><div class="sum-value">${v}</div></div><div><div class="sum-label">מחלה / היעדרות</div><div class="sum-value">${s+a}</div></div></div>`;document.getElementById("history").innerHTML=h.length?h.map(x=>x.source==="attendance"?`<article class="row"><div class="row-top"><div class="date">${x.date.split("-").reverse().join("/")}</div><div class="type">🕐 עבודה</div></div><div class="times">${x.start||"--:--"} → ${x.end||"--:--"} <span class="total">${x.total||""}</span></div>${x.note?`<div class="note">💬 ${escapeHtml(x.note)}</div>`:""}</article>`:`<article class="row"><div class="row-top"><div class="date">${x.absenceFrom?x.absenceFrom.split("-").reverse().join("/"):x.date}</div><div class="type">${x.absenceType==="מחלה"?"🤒":x.absenceType==="חופשה"?"🏖️":"🚫"} ${x.absenceType}</div></div><div class="times">${x.absenceFrom&&x.absenceTo?x.absenceFrom.split("-").reverse().join("/")+" → "+x.absenceTo.split("-").reverse().join("/"):x.date}</div>${x.note?`<div class="note">💬 ${escapeHtml(x.note)}</div>`:""}</article>`).join(""):`<div style="text-align:center;color:var(--muted);padding:40px">אין דיווחים להצגה</div>`}
function escapeHtml(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
if(session){enterHome()}else{lang(currentLang)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
